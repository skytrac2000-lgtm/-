name: Build flying tractor APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o tractor_turbo_android_project.zip
          cd tractor_turbo_android_project
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tractor-turbo-debug-apk
          path: tractor_turbo_android_project/android/app/build/outputs/apk/debug/app-debug.apk
